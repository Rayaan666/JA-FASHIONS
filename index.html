<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport & Mobile ─────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E91E8F" />

    <!-- ── SEO Core ──────────────────────────────────────── -->
    <title>JA Fashions Dubai | Luxury Designer Fashion for Women in UAE</title>
    <meta
      name="description"
      content="Shop JA Fashions Dubai for women's luxury designer fashion, party wear gowns, kurtis, plus-size styles, jewellery, and curated occasion outfits across the UAE."
    />
    <meta
      name="keywords"
      content="JA Fashions Dubai, luxury designer fashion UAE, women's designer wear Dubai, party wear gowns Dubai, kurtis UAE, plus size fashion Dubai, jewellery UAE, luxury boutique Dubai"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="JA Fashions" />
    <link rel="canonical" href="https://www.jafashions.com/" />

    <!-- ── Open Graph (Facebook / LinkedIn) ─────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jafashions.com/" />
    <meta property="og:title" content="JA Fashions Dubai | Luxury Designer Fashion for Women in UAE" />
    <meta
      property="og:description"
      content="Explore women's luxury designer wear in Dubai, including party wear gowns, kurtis, jewellery, plus-size styles, and curated occasion outfits by JA Fashions."
    />
    <meta property="og:image" content="https://www.jafashions.com/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JA Fashions luxury fashion editorial collection" />
    <meta property="og:site_name" content="JA Fashions" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ──────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@jafashions" />
    <meta name="twitter:creator" content="@jafashions" />
    <meta name="twitter:title" content="JA Fashions Dubai | Luxury Designer Fashion for Women in UAE" />
    <meta
      name="twitter:description"
      content="Shop women's luxury designer fashion in Dubai and across the UAE, from party wear gowns and kurtis to jewellery and plus-size styles."
    />
    <meta name="twitter:image" content="https://www.jafashions.com/og-cover.jpg" />
    <meta name="twitter:image:alt" content="JA Fashions luxury fashion editorial collection" />

    <!-- ── Favicon ───────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Preconnect for Performance ───────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Preload critical font (layout-shift prevention) ─ -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&family=Poppins:wght@300;400;500&display=swap"
      as="style"
    />

    <!-- ── Structured Data: Website + Breadcrumb ─────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JA Fashions",
      "url": "https://www.jafashions.com",
      "description": "Dubai luxury fashion boutique for women's designer wear, party wear gowns, kurtis, plus-size styles, jewellery, and occasion outfits",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.jafashions.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      ],
      "contactPoint": {
        "@type": "ContactPoint",

        "email": "jafashions2014@gmail.com",

      }
    }
    </script>
  </head>
